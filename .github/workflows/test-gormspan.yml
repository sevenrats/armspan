---
name: Test gormspan

on:
  push:
    branches:
      - main-armspan
    paths:
      - "gormspan/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "gormspan/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test gormspan package
        run: go test -v -race -count=1 ./gormspan/...

      - name: Vet gormspan package
        run: go vet ./gormspan/...
