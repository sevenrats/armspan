---
name: Sync handful fork

# Whenever a new tag is pushed to armspan, rebase the handful
# modifications onto the tailscale version referenced in armspan's
# go.mod, then push that as the same tag to sevenrats/handful.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sync-handful:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: meta
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Checkout armspan (for go.mod and scripts)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.tag }}
          path: armspan

      - name: Clone handful
        run: |
          git clone https://github.com/sevenrats/handful.git handful

      - name: Run sync script
        run: |
          bash armspan/.github/scripts/sync-handful.sh
        env:
          ARMSPAN_TAG: ${{ steps.meta.outputs.tag }}
          ARMSPAN_GOMOD: armspan/go.mod
          HANDFUL_DIR: handful
          HANDFUL_PAT: ${{ secrets.HANDFUL_PAT }}
