---
name: Docker build (armspan tags)

on:
  push:
    tags:
      - "v*-armspan"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.23.0-armspan)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/armspan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: meta_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Strip the -armspan suffix for the Docker image tag
          DOCKER_TAG="${RAW_TAG%-armspan}"
          echo "raw_tag=$RAW_TAG"       >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta_tag.outputs.raw_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.meta_tag.outputs.docker_tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta_tag.outputs.docker_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
